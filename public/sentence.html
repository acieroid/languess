<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentence Guess</title>
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body data-game="sentences">
    <main class="game-shell">
      <header>
        <h1>Sentence Guess</h1>
        <p class="subtitle">Which language does this sentence belong to?</p>
        <p class="game-switch"><a href="index.html">← Try Word Guess</a></p>
      </header>
      <section class="controls" aria-label="Game settings">
        <label>Difficulty<select id="difficulty"><option value="easy">Easy · 3 choices</option><option value="medium">Medium · 6 choices</option><option value="hard">Hard · type the language</option></select></label>
        <label>Minimum sentence words<input id="minimum-length" type="number" min="1" value="3" inputmode="numeric"></label>
        <section class="language-filters" aria-label="Choose languages"><div class="filter-heading"><span>Choose languages</span><span id="filter-count">Loading language choices…</span></div><div id="filter-groups" class="filter-groups"></div><button id="filter-reset" class="filter-reset" type="button">All languages</button></section>
        <input id="full-dataset" type="checkbox" hidden>
        <button id="start" type="button">Start game</button>
      </section>
      <p id="status" class="status" role="status">Choose settings and start a game.</p>
      <section id="loading" class="loading" aria-live="polite" hidden><div class="loading-copy"><span id="loading-label">Loading sentence collections</span><span id="loading-count">0 / 0</span></div><progress id="loading-progress" max="1" value="0">0%</progress></section>
      <section id="round" class="round" hidden>
        <div class="score" id="score">Score: 0 / 0</div><p id="word" class="word sentence" aria-live="polite"></p><div id="answers" class="answers"></div>
        <div id="hard-answer" class="hard-answer" hidden><label for="guess-input">Language</label><input id="guess-input" list="language-suggestions" autocomplete="off" placeholder="Start typing a language"><datalist id="language-suggestions"></datalist><button id="submit-guess" type="button">Submit guess</button></div>
        <p id="feedback" class="feedback" role="status"></p><button id="next" class="next" type="button" hidden>Next sentence</button>
      </section>
      <footer class="attribution">Sentence data: <a href="https://tatoeba.org/en/downloads">Tatoeba</a>, licensed under CC BY 2.0 FR. Sentences are community-contributed.</footer>
    </main>
    <script src="assets/app.js"></script>
  </body>
</html>
